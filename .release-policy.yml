{
  "kind": "none",
  "versioning": {
    "mode": "release-please"
  },
  "build": {
    "test": "npm ci && npm test && npx wrangler deploy --dry-run --outdir dist/wrangler",
    "command": "npm ci && npm run check"
  },
  "assets": {
    "required": [],
    "optional": []
  },
  "registries": {
    "github": {
      "required": true
    }
  },
  "retention": {
    "stable": 1,
    "prerelease": 1,
    "failed_draft": 2,
    "pruneStable": true
  },
  "checksums": false,
  "sbom": false,
  "repository": {
    "git": {
      "productionOperations": {
        "base": "default",
        "branches": [
          "chore/cutover-*",
          "ops/*",
          "release/*",
          "hotfix/*"
        ],
        "requireLatestBase": true
      }
    }
  },
  "release": {
    "postRelease": [
      {
        "id": "refresh-download-page",
        "type": "github-workflow",
        "required": true,
        "workflow": "update-download-page.yml",
        "inputs": {
          "tag": "{{tag}}",
          "deploy-docs": "false"
        }
      },
      {
        "id": "deploy-docs",
        "type": "github-workflow",
        "required": true,
        "workflow": "static.yml",
        "inputs": {
          "tag": "{{tag}}"
        }
      }
    ]
  }
}
