name: Release

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      version: {description: "Existing version; blank reads the manifest", required: false, type: string}
      dry_run: {description: "Build and validate without publishing", required: false, default: false, type: boolean}
      force: {description: "Rerun a healthy version", required: false, default: false, type: boolean}
      repair: {description: "Repair the current incomplete version", required: false, default: false, type: boolean}
      stage: {description: "Recovery stage label", required: false, default: all, type: string}

permissions:
  contents: write
  pull-requests: write
  packages: write
  issues: write
  actions: write # post-release-docs 需要派发 update-download-page.yml / static.yml
  id-token: write

jobs:
  release:
    # Skip release-please PRs (authored by github-actions[bot]): GitHub holds their
    # workflow runs for approval so they never start, which shows a permanent failed
    # check on every release PR. Self-healing: once RELEASE_PLEASE_TOKEN (a real user
    # PAT) authors the release PR, this guard no longer matches and CI returns.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    uses: redtidev1918/releasegraph/.github/workflows/reusable-release.yml@6d6f4a4a0a7631b55ccc20b4b1f0e89969484b61 # ReleaseGraph v1.5.14
    with:
      version: ${{ inputs.version || '' }}
      dry_run: ${{ github.event_name == 'pull_request' || inputs.dry_run || false }}
      force: ${{ inputs.force || false }}
      repair: ${{ github.event_name == 'pull_request' || inputs.repair || false }}
      stage: ${{ inputs.stage || 'all' }}
    secrets: inherit

  # 发布后自动刷新下载页 + 重建 Pages。
  # 不依赖 releasegraph 内置的 postRelease 派发（其 finalize job 用自己的权限，
  # 会覆盖 caller 的 actions:write，导致 workflow_dispatch 403）；这里改成我们自己的
  # 独立 job，用 caller 的 actions:write 权限、在 release 成功且有 tag 时派发。
  post-release-docs:
    needs: release
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.run_release == '1' &&
      github.event_name != 'pull_request' &&
      needs.release.outputs.tag != null &&
      needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Dispatch download page refresh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh workflow run update-download-page.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "tag=${RELEASE_TAG}" \
            -f "deploy-docs=true"
